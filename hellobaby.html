<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Be My Valentine 💘</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
  font-family: system-ui, -apple-system, BlinkMacSystemFont,
               "Segoe UI", "Apple Color Emoji",
               "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

.app {
  background: white;
  width: 90%;
  max-width: 360px;
  padding: 25px;
  border-radius: 25px;
  text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.2);
  position: relative;
  z-index: 2;
}

h1 {
  color: #ff4d6d;
  margin-bottom: 20px;
}

.buttons {
  position: relative;
  height: 160px;
}

button {
  border: none;
  border-radius: 999px;
  padding: 14px 24px;
  font-size: 18px;
  cursor: pointer;
  position: absolute;
  transition: all 0.35s ease;
  white-space: nowrap;
}

#yesBtn {
  background: #ff4d6d;
  color: white;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
}

#noBtn {
  background: #eee;
  color: #333;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
}

.heart {
  position: fixed;
  color: #ff4d6d;
  font-size: 20px;
  animation: float 6s linear infinite;
  opacity: 0.7;
  z-index: 1;
}

@keyframes float {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

.confetti {
  position: fixed;
  width: 8px;
  height: 8px;
  animation: fall 2s linear forwards;
  z-index: 3;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="bgSound" src="bg.mp3" loop></audio>
<audio id="noSound" src="no.mp3"></audio>
<audio id="yesSound" src="yes.mp3"></audio>

<script>
for (let i = 0; i < 25; i++) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.textContent = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = 4 + Math.random() * 4 + "s";
  document.body.appendChild(heart);
}
</script>

<div class="app" id="app">
  <h1>Glaiza 💖<br>Will you be my Valentine?</h1>

  <div class="buttons">
    <button id="noBtn">No</button>
    <button id="yesBtn">Yes 💘</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const yesBtn = document.getElementById("yesBtn");
const app = document.getElementById("app");

const bgSound = document.getElementById("bgSound");
const noSound = document.getElementById("noSound");
const yesSound = document.getElementById("yesSound");

let yesSize = 1;
let bgStarted = false;

const noPhrases = [
  "Are you sure? 😔",
  "Think again 😭",
  "That hurts baby 😞💔",
  "Please reconsider 🥺",
  "Wrong choice 💀😆",
  "Still no? 😭",
  "mommy please 👉👈☺",
  "Ayaw ana lalay 😁",
  "Still no like no no? 😭",
  "My heart is breaking 💔",
  "Pleaseeee 🥹",
  "Last chance 😵"
];

let phraseIndex = 0;

// Start background music on first interaction
document.body.addEventListener("click", () => {
  if (!bgStarted) {
    bgSound.volume = 0.25; // soft background
    bgSound.play().catch(()=>{});
    bgStarted = true;
  }
}, { once: true });

noBtn.addEventListener("click", () => {
  noSound.currentTime = 0;
  noSound.play().catch(()=>{});

  noBtn.textContent = noPhrases[phraseIndex++ % noPhrases.length];

  const x = Math.random() * 200;
  const y = Math.random() * 80;
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  yesSize += 0.12;
  yesBtn.style.transform = `translateX(-50%) scale(${yesSize})`;
});

yesBtn.addEventListener("click", () => {
  yesSound.currentTime = 0;
  yesSound.play().catch(()=>{});

  bgSound.volume = 0.15; // lower bg music during celebration

  for (let i = 0; i < 80; i++) {
    const c = document.createElement("div");
    c.className = "confetti";
    c.style.left = Math.random() * 100 + "vw";
    c.style.background =
      ["#ff4d6d","#ffc0cb","#ffb6c1"][Math.floor(Math.random()*3)];
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 2000);
  }

  app.innerHTML = `
    <h1>YAYY 💖</h1>
    <p style="font-size:18px">
      You're now my Valentine 💘<br>
      no takes back 😌
    </p>
  `;
});
</script>

</body>
</html>
